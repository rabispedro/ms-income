spring:
  application:
    name: oauth

  profiles:
    active:
    - dev
    default: dev

  security:
    user:
      name: myUser
      password: mypass
    oauth2:
      authorizationserver:
        client:
          ms-income-client:
            registration:
              client-id: "ms-income-oauth2-client"
              client-secret: "ms-income-oauth2-client-secret"
              client-authentication-methods:
              - "client_secret_basic"
              authorization-grant-types:
              - "authorization_code"
              - "refresh_token"
              redirect-uris:
              - "http://localhost:8761/"
              scopes:
              - "openid"
              - "profile"
            require-authorization-consent: true

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    '[org.springframework.security]': trace

management:
  endpoints:
    web:
      exposure:
        include:
        - '*'

server:
  port: ${PORT:0}
  error:
    include-stacktrace: never
    include-message: always
    whitelabel:
      enabled: false

encoder:
  strength: 13
