spring:
  application:
    name: payroll-api

  config:
    name: dev

  profiles:
    active:
    - dev
    default: dev

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

server:
  port: ${PORT:0}
  error:
    include-stacktrace: never
    include-message: always
    whitelabel:
      enabled: false
